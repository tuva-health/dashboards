name: python_dash tests

# The no-warehouse suite: synthetic DuckDB fixtures and the Tuva 1.0
# retired-name checks. The check against a real Tuva 1.0 build stays opt-in
# (TUVA_V1_DUCKDB, see python_dash/README.md) and skips here.
# Every pull request, without a paths filter, so the check always reports
# and can be made required.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A re-push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python_dash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Run tests
        run: uv run --no-project --with-requirements requirements.txt --with pytest pytest -q
